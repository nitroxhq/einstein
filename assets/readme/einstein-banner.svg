<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="einstein-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3232ff" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12" />
      <stop offset="100%" stop-color="#12121a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="400" rx="20" fill="none" stroke="#252538" stroke-width="2" />

  <!-- Subtle glow orb -->
  <circle cx="240" cy="200" r="140" fill="url(#einstein-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Interim logo — graduation cap (matches grad-cap emoji) -->
  <g transform="translate(140, 100)">
    <circle cx="100" cy="80" r="40" fill="#3232ff" opacity="0.15"/>
    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="72" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" fill="#4f46e5">🎓</text>
  </g>

  <!-- Typography -->
  <g transform="translate(360, 160)">
    <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#6366f1" letter-spacing="3" text-transform="uppercase">NITROX RESEARCH</text>
    <text y="70" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">einstein</text>
    <text y="125" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="24" font-weight="400" fill="#9ca3af">
      academic grade assistant <tspan fill="#4b5563">·</tspan> delta explainer <tspan fill="#4b5563">·</tspan> what-if lab
    </text>
  </g>

  <!-- Badge / Tag -->
  <g transform="translate(1000, 50)">
    <rect width="140" height="34" rx="17" fill="#1e1e2d" stroke="#373752" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#22c55e" />
    <text x="34" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">LOCAL-FIRST</text>
  </g>
</svg>

